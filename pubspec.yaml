name: taskie
description: "A focused offline-first task manager"
publish_to: 'none' 
version: 1.0.0+1

flutter_launcher_icons:
  android: true
  ios: false  # we're Android-only per our case study
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#4F67F8"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter_native_splash:
  color: "#F6F6F6"
  image: assets/icons/logo_mark.png
  branding: assets/icons/branding_credit_light.png
  branding_mode: bottom
  android_12:
    color: "#F6F6F6"
    image: assets/icons/logo_mark.png
    icon_background_color: "#F6F6F6"
    color_dark: "#0E0E0E"
    image_dark: assets/icons/app_icon_foreground.png
    icon_background_color_dark: "#0E0E0E"

  # Dark mode variants
  color_dark: "#0E0E0E"
  image_dark: assets/icons/app_icon_foreground.png
  branding_dark: assets/icons/branding_credit_dark.png

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5
  go_router: ^17.2.3
  intl: ^0.20.2
  uuid: ^4.5.3
  flutter_local_notifications: ^21.0.0
  google_fonts: 
  shared_preferences: ^2.5.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  showcaseview: ^5.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints:
  isar_generator: 
  build_runner:


flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
